name: E2E Full-stack (Playwright)

# Chạy toàn bộ E2E trình duyệt (Admin + Frontend + Backend) trên một runner.
# Playwright (host tại repo admin) tự dựng cả 3 server qua webServer. DB là
# PostgreSQL 17 dùng-một-lần với TÊN thien_duc_test (khớp cầu chì an toàn của
# seed-e2e + globalSetup). Mọi secret là GIÁ TRỊ GIẢ; không Resend/Cloudinary/
# Sentry/DB production. Không kích hoạt deploy.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thien_duc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: '1'

    steps:
      # Ba repo checkout thành thư mục anh em (Playwright config trỏ ../<repo>).
      # Cross-repo cần token có quyền đọc (secrets.WORKSPACE_TOKEN) nếu là private.
      - uses: actions/checkout@v5
        with:
          path: thien-duc-website-admin
      - uses: actions/checkout@v5
        with:
          repository: CESxMidas/thien-duc-website-backend
          token: ${{ secrets.WORKSPACE_TOKEN || github.token }}
          path: thien-duc-website-backend
      - uses: actions/checkout@v5
        with:
          repository: CESxMidas/thien-duc-website-frontend
          token: ${{ secrets.WORKSPACE_TOKEN || github.token }}
          path: thien-duc-website-frontend

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # .env GIẢ cho CI (không commit trong repo). Backend .env cấp DATABASE_URL +
      # mật khẩu seed cho globalSetup; Playwright webServer bơm MAIL_FAKE_TRANSPORT=1.
      - name: Ghi .env giả cho CI
        run: |
          cat > thien-duc-website-backend/.env <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/thien_duc_test?sslmode=disable
          ADMIN_APP_URL=http://127.0.0.1:5174
          FRONTEND_URL=http://127.0.0.1:3000
          CORS_ORIGIN=http://127.0.0.1:3000,http://127.0.0.1:5174
          JWT_ACCESS_SECRET=ci-fake-access-secret-thien-duc-minimum-32-characters
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=ci-fake-refresh-secret-thien-duc-minimum-32-characters
          JWT_REFRESH_EXPIRES_IN=7d
          ADMIN_EMAIL=admin-e2e@test.local
          ADMIN_PASSWORD=CiTestPassword123!
          SUPER_ADMIN_EMAIL=superadmin@test.local
          SUPER_ADMIN_PASSWORD=CiTestPassword123!
          RESEND_API_KEY=
          MAIL_FROM=Thien Duc CI <no-reply@test.local>
          CONTACT_NOTIFY_TO=receiver@test.local
          CLOUDINARY_CLOUD_NAME=
          CLOUDINARY_API_KEY=
          CLOUDINARY_API_SECRET=
          SENTRY_DSN=
          EOF
          printf 'VITE_API_URL=http://127.0.0.1:3001/api\nVITE_PUBLIC_SITE_URL=http://127.0.0.1:3000\nVITE_SENTRY_DSN=\n' > thien-duc-website-admin/.env
          printf 'NEXT_PUBLIC_API_URL=http://127.0.0.1:3001/api\nNEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000\nNEXT_PUBLIC_SENTRY_DSN=\n' > thien-duc-website-frontend/.env

      - name: Cài dependencies (backend + admin + frontend)
        run: |
          (cd thien-duc-website-backend && npm ci)
          (cd thien-duc-website-admin && npm ci)
          (cd thien-duc-website-frontend && npm ci)

      - name: Cài Playwright Chromium
        run: cd thien-duc-website-admin && npx playwright install --with-deps chromium

      # ---------------------------------------------------------------------
      # Chuẩn bị DB thành các BƯỚC RIÊNG. globalSetup của Playwright vẫn chạy
      # lại (idempotent), nhưng tách ra đây thì lỗi prisma hiện đúng bước của nó
      # thay vì bị chôn trong log webServer.
      # ---------------------------------------------------------------------
      - name: Postgres sẵn sàng (kiểm có giới hạn)
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL ready on port 5432 (sau ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL unavailable on port 5432"
          exit 1

      - name: Prisma validate / generate / migrate / seed
        working-directory: thien-duc-website-backend
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      # seed-e2e.js gán CỨNG vai trò ADMIN cho ADMIN_EMAIL và SUPER_ADMIN cho
      # SUPER_ADMIN_EMAIL, nhánh ON CONFLICT có `role = EXCLUDED.role` nên chạy
      # lại vẫn đúng vai trò. Vẫn kiểm lại ở đây: CI backend từng đỏ vì tài khoản
      # bootstrap bị seed thành SUPER_ADMIN. CHỈ in vai trò, không in mật khẩu.
      - name: Kiểm vai trò tài khoản bootstrap phải là ADMIN
        env:
          PGPASSWORD: postgres
        run: |
          ROLE=$(psql -h 127.0.0.1 -U postgres -d thien_duc_test -tAc \
            "SELECT role FROM users WHERE email = 'admin-e2e@test.local'")
          echo "bootstrap role = ${ROLE:-<không tìm thấy>}"
          if [ "$ROLE" != "ADMIN" ]; then
            echo "Expected bootstrap E2E account role ADMIN. Check seed-e2e.js upsert."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Dựng 3 service TRƯỚC Playwright, mỗi service một log riêng. Nhờ vậy khi
      # hỏng ta biết NGAY service nào và đọc được lỗi khởi động thật, thay vì chỉ
      # thấy "Timed out waiting 180000ms from config.webServer".
      # Playwright chạy sau với reuseExistingServer=true ở CI nên dùng lại đúng
      # các tiến trình này.
      # ---------------------------------------------------------------------
      - name: Khởi động Backend (3001)
        working-directory: thien-duc-website-backend
        env:
          NODE_ENV: test
          MAIL_FAKE_TRANSPORT: '1'
          RESEND_API_KEY: ''
          CLOUDINARY_CLOUD_NAME: ''
          CLOUDINARY_API_KEY: ''
          CLOUDINARY_API_SECRET: ''
          SENTRY_DSN: ''
        run: npm run start > "$GITHUB_WORKSPACE/backend.log" 2>&1 &

      - name: Khởi động Admin (5174)
        working-directory: thien-duc-website-admin
        run: npm run dev -- --host 127.0.0.1 --port 5174 --strictPort > "$GITHUB_WORKSPACE/admin.log" 2>&1 &

      - name: Khởi động Frontend (3000)
        working-directory: thien-duc-website-frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SENTRY_DSN: ''
        # KHÔNG truyền `--hostname`: mặc định `next dev` bind 0.0.0.0 (nhận cả
        # 127.0.0.1). Thêm `--hostname 127.0.0.1` sẽ làm rewrite locale trong
        # `src/proxy.ts` biến thành redirect → vòng lặp 308 vô tận trên mọi trang.
        run: npm run dev -- --port 3000 > "$GITHUB_WORKSPACE/frontend.log" 2>&1 &

      # Vòng lặp thử lại có giới hạn — KHÔNG sleep cố định, KHÔNG `|| true`,
      # KHÔNG continue-on-error. Hỏng service nào thì in log của đúng service đó.
      - name: Backend sẵn sàng (http://127.0.0.1:3001/api)
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3001/api; then
              echo "Backend ready on port 3001 (sau ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "Backend unavailable on port 3001"
          echo "--- backend.log ---"
          cat "$GITHUB_WORKSPACE/backend.log"
          exit 1

      - name: Admin sẵn sàng (http://127.0.0.1:5174/)
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:5174/; then
              echo "Admin ready on port 5174 (sau ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "Admin unavailable on port 5174"
          echo "--- admin.log ---"
          cat "$GITHUB_WORKSPACE/admin.log"
          exit 1

      - name: Frontend sẵn sàng (http://127.0.0.1:3000/api/health)
        run: |
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/health; then
              echo "Frontend ready on port 3000 (sau ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend unavailable on port 3000"
          echo "--- frontend.log ---"
          cat "$GITHUB_WORKSPACE/frontend.log"
          exit 1

      # Làm nóng một trang thật: lần biên dịch đầu của `next dev` kéo theo layout
      # + Tailwind + next/font/google (có gọi mạng). Trả tiền ở đây, có log rõ,
      # thay vì để nó ăn vào hạn chờ 30s của test đầu tiên.
      - name: Làm nóng trang chủ frontend
        run: |
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "Frontend home compiled (sau ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend home never compiled on port 3000"
          echo "--- frontend.log ---"
          cat "$GITHUB_WORKSPACE/frontend.log"
          exit 1

      - name: Chạy E2E full-stack
        working-directory: thien-duc-website-admin
        env:
          DEBUG: pw:webserver
        run: npm run test:e2e

      - name: Log các service (khi lỗi)
        if: failure()
        run: |
          for f in backend admin frontend; do
            echo "=================== $f.log ==================="
            cat "$GITHUB_WORKSPACE/$f.log" || echo "(không có log $f)"
          done

      - name: Tải Playwright report + trace (khi lỗi)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            thien-duc-website-admin/playwright-report
            thien-duc-website-admin/test-results
          retention-days: 7
