name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Unit/component test (Vitest) + coverage (ngưỡng chống hồi quy ở vitest.config.ts)
      - run: npm run test:coverage

      # "build" = tsc -b && vite build → typecheck + build trong một bước
      - run: npm run build
